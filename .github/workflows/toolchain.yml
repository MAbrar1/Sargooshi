name: Toolchain smoke check
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/toolchain.yml'
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version
